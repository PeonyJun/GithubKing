<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<title>Github King · 移动端界面方案</title>
<link rel="stylesheet" href="./vendor/font-awesome/css/all.min.css">
<style>
/* ============================================================
   设计令牌 Design Tokens
   ============================================================ */
:root{
  /* 间距 4pt 网格 */
  --sp-1:4px;  --sp-2:8px;  --sp-3:12px; --sp-4:16px;
  --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px;
  /* 圆角 */
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px; --r-full:999px;
  /* 字号 */
  --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px;
  --fs-16:16px; --fs-18:18px; --fs-20:20px; --fs-24:24px; --fs-28:28px;
  /* 结构尺寸 */
  --tap:48px;
  --appbar-h:56px; --ctx-h:46px; --tabbar-h:58px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  /* 动效 */
  --ease:cubic-bezier(.2,.8,.2,1);
  --dur-1:140ms; --dur-2:240ms; --dur-3:360ms;
}
/* 深色主题（默认） */
:root{
  --bg:#0B0D12; --surface:#14171F; --surface-2:#1B1F29; --surface-3:#242935;
  --border:#262B36; --border-2:#333A48;
  --t1:#E8EAF0; --t2:#A2AAB9; --t3:#7C8493;
  --brand:#7451F5; --brand-text:#A78BFA; --brand-ink:#FFFFFF;
  --brand-soft:rgba(124,92,255,.16);
  --ok:#3DD68C; --warn:#F7B955; --err:#F2555A; --info:#5B9DFF;
  --sheet-handle:#3A4250;
  --sh-1:0 1px 2px rgba(0,0,0,.5);
  --sh-2:0 10px 30px rgba(0,0,0,.55);
  --sh-3:0 -8px 32px rgba(0,0,0,.5);
}
/* 浅色主题 */
[data-theme="light"]{
  --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#F3F4F8; --surface-3:#E9EBF1;
  --border:#E4E7ED; --border-2:#D2D7E0;
  --t1:#16181D; --t2:#5C6470; --t3:#6B7280;
  --brand:#6A45E8; --brand-text:#6A45E8; --brand-ink:#FFFFFF;
  --brand-soft:rgba(106,69,232,.10);
  --ok:#16A34A; --warn:#C2740A; --err:#DC2626; --info:#2563EB;
  --sheet-handle:#D2D7E0;
  --sh-1:0 1px 2px rgba(16,24,40,.06);
  --sh-2:0 10px 30px rgba(16,24,40,.10);
  --sh-3:0 -8px 32px rgba(16,24,40,.12);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#10131A; color:var(--t1);
  font-size:var(--fs-14); line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:none}
input:focus{outline:none}
ul{list-style:none}

/* ---------- 设备外壳（桌面预览用；真机上自动全屏） ---------- */
.device{
  position:relative; width:100%; max-width:var(--dev-w,430px);
  height:100vh; height:100dvh; max-height:var(--dev-h,932px);
  background:var(--bg); overflow:hidden;
  display:flex; flex-direction:column;
  isolation:isolate;
}
@media (min-width:520px) and (min-height:760px){
  body{background:
    radial-gradient(900px 600px at 20% -10%, #23283A 0%, transparent 60%),
    radial-gradient(700px 500px at 110% 110%, #2A2140 0%, transparent 55%),
    #0A0C11;}
  .device{
    height:min(932px, 96vh); border-radius:44px;
    box-shadow:0 0 0 11px #1C2029, 0 0 0 13px #2C313C, 0 40px 90px rgba(0,0,0,.6);
  }
  .device::after{
    content:""; position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(8px + var(--safe-b)); width:134px; height:5px; border-radius:3px;
    background:var(--sheet-handle); opacity:.7; z-index:900; pointer-events:none;
  }
}

/* ============================================================
   登录页
   ============================================================ */
.auth{position:absolute; inset:0; z-index:50; background:var(--bg);
  display:flex; flex-direction:column; padding:calc(var(--sp-8) + var(--safe-t)) var(--sp-6) calc(var(--sp-8) + var(--safe-b));
  transition:opacity var(--dur-3) var(--ease), visibility var(--dur-3);
}
.auth.is-hidden{opacity:0; visibility:hidden; pointer-events:none}
.auth-brand{display:flex; flex-direction:column; align-items:center; gap:var(--sp-3); margin-top:auto}
.auth-logo{width:76px;height:76px;border-radius:22px;background:var(--brand-soft);
  display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--brand-text);
  border:1px solid var(--border)}
.auth-title{font-size:var(--fs-24);font-weight:700;letter-spacing:-.4px}
.auth-sub{font-size:var(--fs-13);color:var(--t2)}
.auth-form{display:flex;flex-direction:column;gap:var(--sp-3);margin-top:var(--sp-8)}
.field{display:flex;align-items:center;gap:var(--sp-3);height:var(--tap);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:0 var(--sp-4);transition:border-color var(--dur-1),box-shadow var(--dur-1)}
.field:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.field i{color:var(--t3);font-size:var(--fs-14);flex-shrink:0}
.field input{flex:1;min-width:0;font-size:var(--fs-14)}
.field input::placeholder{color:var(--t3)}
.btn-primary{height:var(--tap);border-radius:var(--r-md);background:var(--brand);color:var(--brand-ink);
  font-size:var(--fs-16);font-weight:600;display:flex;align-items:center;justify-content:center;gap:var(--sp-2);
  transition:transform var(--dur-1) var(--ease),opacity var(--dur-1)}
.btn-primary:active{transform:scale(.975);opacity:.9}
.btn-ghost{height:var(--tap);border-radius:var(--r-md);border:1px solid var(--border-2);color:var(--t2);
  font-size:var(--fs-15,15px);display:flex;align-items:center;justify-content:center;gap:var(--sp-2)}
.btn-ghost:active{background:var(--surface-2)}
.auth-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:var(--sp-4);padding-top:var(--sp-8)}
.link-btn{font-size:var(--fs-13);color:var(--brand-text);display:inline-flex;align-items:center;gap:6px}
.copyright{font-size:var(--fs-11);color:var(--t3)}

/* ============================================================
   应用骨架
   ============================================================ */
.app{display:flex;flex-direction:column;height:100%;min-height:0}

/* 顶部应用栏 */
.appbar{
  flex-shrink:0; height:calc(var(--appbar-h) + var(--safe-t));
  padding:var(--safe-t) var(--sp-2) 0;
  display:flex;align-items:center;gap:var(--sp-1);
  background:var(--surface); border-bottom:1px solid var(--border);
  z-index:30; transition:transform var(--dur-2) var(--ease);
}
.appbar-title{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:0 var(--sp-2)}
.appbar-title .t{font-size:var(--fs-17,17px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar-title .s{font-size:var(--fs-11);color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;
  color:var(--t2);font-size:var(--fs-18);flex-shrink:0;transition:background var(--dur-1),color var(--dur-1)}
.icon-btn:active{background:var(--surface-2);color:var(--t1)}
.icon-btn.is-on{color:var(--brand-text);background:var(--brand-soft)}

/* 上下文面包屑栏 */
.ctxbar{
  flex-shrink:0;height:var(--ctx-h);display:flex;align-items:center;gap:var(--sp-1);
  padding:0 var(--sp-2);background:var(--surface);border-bottom:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none;z-index:29;
  transition:height var(--dur-2) var(--ease),opacity var(--dur-2),border-color var(--dur-2);
}
.ctxbar::-webkit-scrollbar{display:none}
.ctxbar.is-hidden{height:0;opacity:0;border-color:transparent;overflow:hidden}
.crumb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 var(--sp-3);
  border-radius:var(--r-full);background:var(--surface-2);border:1px solid var(--border);
  font-size:var(--fs-13);color:var(--t2);white-space:nowrap;flex-shrink:0}
.crumb i{font-size:10px;color:var(--t3)}
.crumb.is-current{background:var(--brand-soft);border-color:transparent;color:var(--brand-text);font-weight:600}
.crumb.is-branch i{color:var(--info)}
.crumb:active{transform:scale(.96)}

/* 内容区 */
.content{position:relative;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--tabbar-h) + var(--safe-b) + var(--sp-6));scroll-behavior:smooth}
.screen{display:none;animation:fadeUp var(--dur-2) var(--ease)}
.screen.is-active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 搜索条 */
.searchbar{padding:var(--sp-3) var(--sp-4) var(--sp-2);position:sticky;top:0;z-index:10;background:var(--bg)}
.searchbar .field{height:44px;border-radius:var(--r-full);background:var(--surface-2)}
.searchbar .field input{font-size:var(--fs-14)}
.search-clear{width:28px;height:28px;border-radius:50%;display:none;align-items:center;justify-content:center;
  color:var(--t3);font-size:12px;flex-shrink:0}
.search-clear.show{display:flex}

/* ============================================================
   列表与卡片
   ============================================================ */
.section-label{display:flex;align-items:center;justify-content:space-between;
  padding:var(--sp-4) var(--sp-4) var(--sp-2);font-size:var(--fs-12);color:var(--t3);font-weight:600;letter-spacing:.4px}
.section-label .count{font-weight:500;letter-spacing:0}

.card-list{display:flex;flex-direction:column;gap:var(--sp-2);padding:0 var(--sp-4) var(--sp-4)}
.card{
  display:flex;align-items:flex-start;gap:var(--sp-3);
  padding:var(--sp-3) var(--sp-3);min-height:64px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  transition:transform var(--dur-1) var(--ease),background var(--dur-1),border-color var(--dur-1);
}
.card:active{transform:scale(.985);background:var(--surface-2)}
.card.is-selected{border-color:var(--brand);background:var(--brand-soft)}
.card-icon{width:40px;height:40px;border-radius:var(--r-sm);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-18);
  background:var(--surface-2);color:var(--t2)}
.card-icon.dir{background:rgba(247,185,85,.14);color:var(--warn)}
.card-icon.code{background:rgba(91,157,255,.14);color:var(--info)}
.card-icon.img{background:rgba(61,214,140,.14);color:var(--ok)}
.card-icon.doc{background:rgba(124,92,255,.14);color:var(--brand-text)}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card-name{font-size:var(--fs-15,15px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-desc{font-size:var(--fs-12);color:var(--t2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;align-items:center;gap:var(--sp-3);font-size:var(--fs-11);color:var(--t3);flex-wrap:wrap}
.card-meta span{display:inline-flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.card-action{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--t3);font-size:var(--fs-14);flex-shrink:0;margin-top:-2px}
.card-action:active{background:var(--surface-3);color:var(--t1)}
.badge{font-size:10px;padding:2px 7px;border-radius:var(--r-full);border:1px solid var(--border-2);color:var(--t3)}
.badge.live{background:rgba(61,214,140,.14);border-color:transparent;color:var(--ok)}
.badge.idle{background:var(--surface-3);border-color:transparent;color:var(--t3)}

/* 网格视图 */
.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-2);padding:0 var(--sp-4) var(--sp-4)}
.card-grid .card{flex-direction:column;align-items:flex-start;gap:var(--sp-2);padding:var(--sp-3)}
.card-grid .card-icon{width:100%;height:56px;border-radius:var(--r-sm)}
.card-grid .card-action{position:absolute;top:6px;right:6px}
.card-grid .card{position:relative}

/* 空状态 */
.empty{display:flex;flex-direction:column;align-items:center;gap:var(--sp-3);
  padding:var(--sp-10) var(--sp-8);text-align:center;color:var(--t3)}
.empty i{font-size:38px;opacity:.5}
.empty p{font-size:var(--fs-13)}

/* 汇总条 */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2);padding:var(--sp-2) var(--sp-4) var(--sp-4)}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-3);text-align:center}
.stat b{display:block;font-size:var(--fs-20);font-weight:700;line-height:1.2}
.stat span{font-size:var(--fs-11);color:var(--t3)}

/* 用户头部 */
.profile{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4);
  background:var(--surface);border-bottom:1px solid var(--border);margin-bottom:var(--sp-2)}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-24);flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{flex:1;min-width:0}
.profile-info b{display:block;font-size:var(--fs-16);font-weight:600}
.profile-info span{font-size:var(--fs-12);color:var(--t3)}

/* 设置分组 */
.group{margin:0 var(--sp-4) var(--sp-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.group-title{padding:var(--sp-3) var(--sp-4) var(--sp-1);font-size:var(--fs-11);color:var(--t3);font-weight:600;letter-spacing:.5px}
.row{display:flex;align-items:center;gap:var(--sp-3);min-height:52px;padding:var(--sp-2) var(--sp-4);
  border-top:1px solid var(--border);transition:background var(--dur-1)}
.group .row:first-of-type{border-top:none}
.row:active{background:var(--surface-2)}
.row-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-13);flex-shrink:0;background:var(--surface-2);color:var(--t2)}
.row-label{flex:1;min-width:0;font-size:var(--fs-15,15px)}
.row-hint{font-size:var(--fs-12);color:var(--t3);flex-shrink:0}
.row .chev{color:var(--t3);font-size:11px;flex-shrink:0}
.row.danger .row-label,.row.danger .row-icon{color:var(--err)}
.row.danger .row-icon{background:rgba(242,85,90,.12)}

/* 开关 */
.switch{width:46px;height:28px;border-radius:var(--r-full);background:var(--surface-3);
  position:relative;flex-shrink:0;transition:background var(--dur-2) var(--ease)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:var(--sh-1);transition:transform var(--dur-2) var(--ease)}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(18px)}

/* ============================================================
   底部标签栏
   ============================================================ */
.tabbar{
  flex-shrink:0;position:relative;z-index:40;
  height:calc(var(--tabbar-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  display:flex;align-items:stretch;
  background:var(--surface);border-top:1px solid var(--border);
  box-shadow:var(--sh-3);
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--t3);font-size:var(--fs-11);position:relative;transition:color var(--dur-1)}
.tab i{font-size:var(--fs-20);line-height:1;transition:transform var(--dur-2) var(--ease)}
.tab.is-active{color:var(--brand-text);font-weight:600}
.tab.is-active i{transform:translateY(-1px) scale(1.06)}
.tab:active i{transform:scale(.9)}
.tab-spacer{flex:1;pointer-events:none}

/* FAB */
.fab-wrap{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(var(--tabbar-h) + var(--safe-b) - 26px);z-index:41}
.fab{width:56px;height:56px;border-radius:var(--r-lg);background:var(--brand);color:var(--brand-ink);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-24);
  box-shadow:0 6px 20px rgba(124,92,255,.45);
  transition:transform var(--dur-2) var(--ease)}
.fab:active{transform:scale(.92)}
.fab.is-open{transform:rotate(135deg)}
.fab-menu{position:absolute;bottom:68px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:flex-end;gap:var(--sp-2);
  opacity:0;visibility:hidden;transition:opacity var(--dur-2) var(--ease),visibility var(--dur-2)}
.fab-menu.is-open{opacity:1;visibility:visible}
.fab-item{display:flex;align-items:center;gap:var(--sp-3);height:44px;padding:0 var(--sp-3) 0 var(--sp-4);
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-full);
  box-shadow:var(--sh-2);font-size:var(--fs-14);white-space:nowrap;
  transform:translateY(10px);transition:transform var(--dur-2) var(--ease)}
.fab-menu.is-open .fab-item{transform:none}
.fab-item i{width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-12);flex-shrink:0}

/* ============================================================
   底部动作面板 Bottom Sheet
   ============================================================ */
.scrim{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.55);
  opacity:0;visibility:hidden;transition:opacity var(--dur-2),visibility var(--dur-2)}
.scrim.is-open{opacity:1;visibility:visible}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;
  background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:var(--sp-2) var(--sp-2) calc(var(--sp-4) + var(--safe-b));
  box-shadow:var(--sh-3);
  transform:translateY(100%);transition:transform var(--dur-3) var(--ease);
  max-height:80%;overflow-y:auto}
.sheet.is-open{transform:none}
.sheet-grab{width:38px;height:4px;border-radius:2px;background:var(--sheet-handle);margin:var(--sp-1) auto var(--sp-3)}
.sheet-title{padding:var(--sp-1) var(--sp-4) var(--sp-3);font-size:var(--fs-16);font-weight:600;
  display:flex;align-items:center;gap:var(--sp-2)}
.sheet-title small{font-size:var(--fs-12);color:var(--t3);font-weight:400}
.opt{display:flex;align-items:center;gap:var(--sp-3);min-height:52px;padding:var(--sp-2) var(--sp-4);
  border-radius:var(--r-md);font-size:var(--fs-15,15px);width:100%;text-align:left;transition:background var(--dur-1)}
.opt:active{background:var(--surface-2)}
.opt i.lead{width:22px;text-align:center;color:var(--t2);font-size:var(--fs-14);flex-shrink:0}
.opt .flex-1{flex:1;min-width:0}
.opt .sub{display:block;font-size:var(--fs-11);color:var(--t3);font-weight:400;margin-top:1px}
.opt .check{color:var(--brand-text);font-size:var(--fs-14);width:20px;text-align:center;flex-shrink:0;
  opacity:0;transition:opacity var(--dur-1)}
.opt.is-selected .check{opacity:1}
.opt.is-selected{color:var(--brand-text);font-weight:600}
.opt.danger{color:var(--err)}
.opt.danger i.lead{color:var(--err)}
.sheet-divider{height:1px;background:var(--border);margin:var(--sp-2) var(--sp-4)}

/* Toast */
.toast{position:absolute;left:50%;transform:translate(-50%,20px);z-index:80;
  bottom:calc(var(--tabbar-h) + var(--safe-b) + var(--sp-4));
  background:var(--surface-3);color:var(--t1);border:1px solid var(--border-2);
  padding:var(--sp-3) var(--sp-5);border-radius:var(--r-full);font-size:var(--fs-13);
  box-shadow:var(--sh-2);opacity:0;visibility:hidden;
  transition:opacity var(--dur-2) var(--ease),transform var(--dur-2) var(--ease),visibility var(--dur-2);
  max-width:88%;text-align:center;display:flex;align-items:center;gap:var(--sp-2)}
.toast.is-open{opacity:1;visibility:visible;transform:translate(-50%,0)}

/* 下拉刷新 */
.ptr{display:flex;align-items:center;justify-content:center;
  height:0;overflow:hidden;color:var(--t3);font-size:var(--fs-12);gap:var(--sp-2);
  transition:height var(--dur-2) var(--ease)}
.ptr.is-loading{height:52px}

/* 多选条 */
.selectbar{position:absolute;left:var(--sp-4);right:var(--sp-4);z-index:35;
  bottom:calc(var(--tabbar-h) + var(--safe-b) + var(--sp-3));
  display:flex;align-items:center;gap:var(--sp-2);height:52px;padding:0 var(--sp-2) 0 var(--sp-4);
  background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--r-md);box-shadow:var(--sh-2);
  transform:translateY(120%);transition:transform var(--dur-3) var(--ease)}
.selectbar.is-open{transform:none}
.selectbar b{font-size:var(--fs-14);flex:1}
.selectbar .icon-btn{width:40px;height:40px}
.selectbar .icon-btn.danger{color:var(--err)}
</style>
</head>
<body>

<div class="device">

  <!-- ============ 登录 ============ -->
  <section class="auth" id="auth">
    <div class="auth-brand">
      <div class="auth-logo"><i class="fa-brands fa-github"></i></div>
      <div class="auth-title">Github King</div>
      <div class="auth-sub">极速 · 优雅 · 全能</div>
    </div>

    <div class="auth-form">
      <label class="field">
        <i class="fa-solid fa-key"></i>
        <input id="tokenInput" placeholder="粘贴 Access Token" autocomplete="off" spellcheck="false">
      </label>
      <button class="btn-primary" id="loginBtn"><span>进入系统</span></button>
      <button class="btn-ghost" id="accountsBtn"><i class="fa-solid fa-users-gear"></i><span>账号管理</span></button>
    </div>

    <div class="auth-foot">
      <button class="link-btn" data-toast="已展开令牌获取指引"><i class="fa-regular fa-circle-question"></i>如何获取 Access Token？</button>
      <div class="copyright">© 2026 牡丹君 · 全能仓库管理器</div>
    </div>
  </section>

  <!-- ============ 主应用 ============ -->
  <div class="app" id="app">

    <header class="appbar">
      <button class="icon-btn" id="backBtn" style="display:none" aria-label="返回上级"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="appbar-title">
        <span class="t" id="barTitle">我的仓库</span>
        <span class="s" id="barSub">mudanjun · 24 个仓库</span>
      </div>
      <button class="icon-btn" id="searchBtn" aria-label="搜索"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button class="icon-btn" id="moreBtn" aria-label="更多操作"><i class="fa-solid fa-ellipsis-vertical"></i></button>
    </header>

    <nav class="ctxbar is-hidden" id="ctxbar" aria-label="路径导航"></nav>

    <main class="content" id="content">
      <div class="ptr" id="ptr"><i class="fa-solid fa-rotate fa-spin"></i><span>正在刷新…</span></div>

      <!-- 仓库 -->
      <section class="screen is-active" id="scr-repos">
        <div class="searchbar"><label class="field">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input class="filter-input" placeholder="搜索仓库、语言、描述…" data-target="repos">
          <button class="search-clear"><i class="fa-solid fa-xmark"></i></button>
        </label></div>
        <div class="stat-row">
          <div class="stat"><b>24</b><span>仓库</span></div>
          <div class="stat"><b>1.2k</b><span>Star</span></div>
          <div class="stat"><b>3.4G</b><span>用量</span></div>
        </div>
        <div class="section-label"><span>最近更新</span><span class="count">8 项</span></div>
        <div class="card-list" id="list-repos"></div>
      </section>

      <!-- 文件 -->
      <section class="screen" id="scr-files">
        <div class="searchbar"><label class="field">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input class="filter-input" placeholder="搜索当前目录的文件…" data-target="files">
          <button class="search-clear"><i class="fa-solid fa-xmark"></i></button>
        </label></div>
        <div class="section-label"><span id="filesCount">文件夹 3 · 文件 6</span><span class="count" id="filesSortLabel">智能排序</span></div>
        <div class="card-list" id="list-files"></div>
      </section>

      <!-- 星标 -->
      <section class="screen" id="scr-starred">
        <div class="searchbar"><label class="field">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input class="filter-input" placeholder="搜索星标仓库…" data-target="starred">
          <button class="search-clear"><i class="fa-solid fa-xmark"></i></button>
        </label></div>
        <div class="card-list" id="list-starred"></div>
      </section>

      <!-- 部署 -->
      <section class="screen" id="scr-deploy">
        <div class="section-label"><span>已发布站点</span><span class="count" data-toast="打开批量部署">批量部署</span></div>
        <div class="card-list" id="list-deploy"></div>
        <div class="group" style="margin-top:var(--sp-2)">
          <div class="row" data-toast="打开部署帮助"><span class="row-icon"><i class="fa-regular fa-circle-question"></i></span><span class="row-label">部署规则说明</span><i class="fa-solid fa-chevron-right chev"></i></div>
          <div class="row" data-toast="打开自定义域名设置"><span class="row-icon"><i class="fa-solid fa-globe"></i></span><span class="row-label">自定义域名</span><span class="row-hint">未绑定</span><i class="fa-solid fa-chevron-right chev"></i></div>
        </div>
      </section>

      <!-- 我的 -->
      <section class="screen" id="scr-me">
        <div class="profile">
          <div class="avatar"><i class="fa-solid fa-user"></i></div>
          <div class="profile-info"><b>mudanjun</b><span>已登录 · Token 剩余 342 天</span></div>
          <button class="icon-btn" data-toast="更换头像"><i class="fa-solid fa-camera"></i></button>
        </div>

        <div class="group-title">账户</div>
        <div class="group">
          <div class="row" data-toast="打开多账户管理"><span class="row-icon"><i class="fa-solid fa-users"></i></span><span class="row-label">多账户管理</span><span class="row-hint">3 个</span><i class="fa-solid fa-chevron-right chev"></i></div>
          <div class="row" data-toast="打开切换账号"><span class="row-icon"><i class="fa-solid fa-right-left"></i></span><span class="row-label">切换账号</span><i class="fa-solid fa-chevron-right chev"></i></div>
        </div>

        <div class="group-title">偏好</div>
        <div class="group">
          <div class="row" id="themeRow"><span class="row-icon"><i class="fa-solid fa-moon"></i></span><span class="row-label">深色主题</span><span class="switch on" id="themeSwitch"></span></div>
          <div class="row" data-sheet="viewSheet"><span class="row-icon"><i class="fa-solid fa-table-cells-large"></i></span><span class="row-label">默认视图</span><span class="row-hint" id="viewHint">列表</span><i class="fa-solid fa-chevron-right chev"></i></div>
          <div class="row" data-sheet="sortSheet"><span class="row-icon"><i class="fa-solid fa-arrow-down-wide-short"></i></span><span class="row-label">默认排序</span><span class="row-hint" id="sortHint">智能排序</span><i class="fa-solid fa-chevron-right chev"></i></div>
          <div class="row" data-sheet="menuSheet"><span class="row-icon"><i class="fa-solid fa-hand-pointer"></i></span><span class="row-label">长按菜单项</span><span class="row-hint">7 / 9</span><i class="fa-solid fa-chevron-right chev"></i></div>
        </div>

        <div class="group-title">网络</div>
        <div class="group">
          <div class="row" data-sheet="proxySheet"><span class="row-icon"><i class="fa-solid fa-shield-halved"></i></span><span class="row-label">代理加速</span><span class="row-hint">已开启 · 香港</span><i class="fa-solid fa-chevron-right chev"></i></div>
          <div class="row" data-toast="清除缓存 24.6 MB"><span class="row-icon"><i class="fa-solid fa-broom"></i></span><span class="row-label">清除缓存</span><span class="row-hint">24.6 MB</span></div>
        </div>

        <div class="group-title">关于</div>
        <div class="group">
          <div class="row" data-toast="打开使用指南"><span class="row-icon"><i class="fa-regular fa-circle-question"></i></span><span class="row-label">使用指南</span><i class="fa-solid fa-chevron-right chev"></i></div>
          <div class="row" data-toast="已是最新版本 3.2.0"><span class="row-icon"><i class="fa-solid fa-tag"></i></span><span class="row-label">版本</span><span class="row-hint">3.2.0</span></div>
        </div>

        <div class="group">
          <div class="row danger" id="logoutRow"><span class="row-icon"><i class="fa-solid fa-arrow-right-from-bracket"></i></span><span class="row-label">退出登录</span></div>
        </div>
      </section>
    </main>

    <!-- 底部标签栏 -->
    <nav class="tabbar">
      <button class="tab is-active" data-tab="repos"><i class="fa-solid fa-box-archive"></i><span>仓库</span></button>
      <button class="tab" data-tab="starred"><i class="fa-regular fa-star"></i><span>星标</span></button>
      <div class="tab-spacer"></div>
      <button class="tab" data-tab="deploy"><i class="fa-solid fa-rocket"></i><span>部署</span></button>
      <button class="tab" data-tab="me"><i class="fa-regular fa-user"></i><span>我的</span></button>
    </nav>

    <div class="fab-wrap">
      <div class="fab-menu" id="fabMenu"></div>
      <button class="fab" id="fab" aria-label="新建"><i class="fa-solid fa-plus"></i></button>
    </div>

    <div class="selectbar" id="selectBar">
      <b id="selCount">已选 0 项</b>
      <button class="icon-btn" data-toast="已复制所选路径"><i class="fa-solid fa-link"></i></button>
      <button class="icon-btn" data-toast="已移动到…"><i class="fa-solid fa-arrows-turn-to-dots"></i></button>
      <button class="icon-btn danger" data-toast="已删除所选项目"><i class="fa-solid fa-trash-can"></i></button>
      <button class="icon-btn" id="exitSelect"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>

  <!-- ============ 遮罩 / 弹层 ============ -->
  <div class="scrim" id="scrim"></div>

  <div class="sheet" id="sheet">
    <div class="sheet-grab"></div>
    <div class="sheet-title" id="sheetTitle"></div>
    <div id="sheetBody"></div>
  </div>

  <div class="toast" id="toast"><i class="fa-solid fa-circle-check" style="color:var(--ok)"></i><span id="toastMsg"></span></div>
</div>

<script>
/* ============ 数据 ============ */
const REPOS=[
 {name:'github-king',desc:'Android 端 GitHub 仓库管理器，WebView 单页应用',lang:'JavaScript',color:'#f1e05a',star:128,fork:12,time:'2 小时前',priv:false},
 {name:'mudan-ui',desc:'轻量移动端组件库，零依赖',lang:'TypeScript',color:'#3178c6',star:342,fork:28,time:'昨天',priv:false},
 {name:'proxy-gateway',desc:'智能分流代理网关，支持多节点健康检查',lang:'Go',color:'#00ADD8',star:89,fork:6,time:'3 天前',priv:true},
 {name:'dotfiles',desc:'个人开发环境配置',lang:'Shell',color:'#89e051',star:12,fork:1,time:'上周',priv:false},
 {name:'notes',desc:'技术笔记与阅读摘录',lang:'Markdown',color:'#083fa1',star:5,fork:0,time:'2 周前',priv:true},
 {name:'image-hosting',desc:'图床服务，支持 CDN 回源与自动压缩',lang:'Python',color:'#3572A5',star:56,fork:9,time:'3 周前',priv:false},
 {name:'flutter-demo',desc:'Flutter 练手项目合集',lang:'Dart',color:'#00B4AB',star:23,fork:3,time:'上个月',priv:false},
 {name:'server-config',desc:'Nginx / Docker 生产配置模板',lang:'Nginx',color:'#009639',star:41,fork:15,time:'2 个月前',priv:true}
];
const STARRED=[
 {name:'vue',desc:'渐进式 JavaScript 框架',lang:'TypeScript',color:'#41b883',star:208000,fork:33000,time:'1 小时前',priv:false},
 {name:'tailwindcss',desc:'实用优先的 CSS 框架',lang:'CSS',color:'#563d7c',star:82000,fork:4200,time:'5 小时前',priv:false},
 {name:'android-architecture',desc:'Android 架构组件示例合集',lang:'Kotlin',color:'#A97BFF',star:44000,fork:12000,time:'昨天',priv:false},
 {name:'awesome-selfhosted',desc:'自托管服务清单',lang:'Markdown',color:'#083fa1',star:210000,fork:16000,time:'2 天前',priv:false}
];
const FILES=[
 {name:'src',type:'dir',meta:'12 项',time:'2 天前'},
 {name:'assets',type:'dir',meta:'5 项',time:'上周'},
 {name:'.github',type:'dir',meta:'2 项',time:'上个月'},
 {name:'index.html',type:'code',meta:'412 KB',time:'2 小时前'},
 {name:'style.css',type:'code',meta:'186 KB',time:'2 小时前'},
 {name:'README.md',type:'doc',meta:'4.2 KB',time:'昨天'},
 {name:'logo.png',type:'img',meta:'86 KB',time:'上周'},
 {name:'banner.jpg',type:'img',meta:'240 KB',time:'2 周前'},
 {name:'LICENSE',type:'doc',meta:'1.1 KB',time:'3 个月前'}
];
const DEPLOY=[
 {name:'king.mudanjun.dev',repo:'github-king',branch:'gh-pages',state:'live',time:'1 天前'},
 {name:'ui-docs.mudanjun.dev',repo:'mudan-ui',branch:'docs',state:'live',time:'5 天前'},
 {name:'old-portfolio',repo:'mudanjun.github.io',branch:'main',state:'idle',time:'已下线'}
];

const FILE_ICON={dir:['fa-solid fa-folder','dir'],code:['fa-solid fa-code','code'],
  img:['fa-regular fa-image','img'],doc:['fa-regular fa-file-lines','doc']};

let viewMode='list', sortMode='smart', selectMode=false, selected=new Set();
let ctxStack=[], originTab='repos';
const CRUMB_ICON={repo:'fa-brands fa-github',branch:'fa-solid fa-code-branch',dir:'fa-solid fa-folder'};

/* ============ 渲染 ============ */
function fmt(n){return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':n}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function repoCard(r){
  return `<article class="card" data-name="${esc(r.name)}">
    <div class="card-icon"><i class="fa-brands fa-github"></i></div>
    <div class="card-body">
      <div class="card-name">${esc(r.name)} ${r.priv?'<span class="badge">私有</span>':''}</div>
      <div class="card-desc">${esc(r.desc)}</div>
      <div class="card-meta">
        <span><i class="dot" style="background:${r.color}"></i>${esc(r.lang)}</span>
        <span><i class="fa-regular fa-star"></i>${fmt(r.star)}</span>
        <span><i class="fa-solid fa-code-fork"></i>${fmt(r.fork)}</span>
        <span>${esc(r.time)}</span>
      </div>
    </div>
    <button class="card-action" data-menu="repo"><i class="fa-solid fa-ellipsis-vertical"></i></button>
  </article>`;
}
function fileCard(f){
  const[icon,cls]=FILE_ICON[f.type];
  return `<article class="card" data-name="${esc(f.name)}" data-type="${f.type}">
    <div class="card-icon ${cls}"><i class="${icon}"></i></div>
    <div class="card-body">
      <div class="card-name">${esc(f.name)}</div>
      <div class="card-meta"><span>${esc(f.meta)}</span><span>${esc(f.time)}</span></div>
    </div>
    <button class="card-action" data-menu="file"><i class="fa-solid fa-ellipsis-vertical"></i></button>
  </article>`;
}
function deployCard(d){
  return `<article class="card" data-name="${esc(d.name)}">
    <div class="card-icon code"><i class="fa-solid fa-globe"></i></div>
    <div class="card-body">
      <div class="card-name">${esc(d.name)} <span class="badge ${d.state==='live'?'live':'idle'}">${d.state==='live'?'运行中':'已下线'}</span></div>
      <div class="card-desc">${esc(d.repo)} · ${esc(d.branch)}</div>
      <div class="card-meta"><span><i class="fa-regular fa-clock"></i>${esc(d.time)}</span></div>
    </div>
    <button class="card-action" data-menu="deploy"><i class="fa-solid fa-ellipsis-vertical"></i></button>
  </article>`;
}

const LISTS={repos:{data:REPOS,render:repoCard},starred:{data:STARRED,render:repoCard},
  files:{data:FILES,render:fileCard},deploy:{data:DEPLOY,render:deployCard}};

function paint(key,filter=''){
  const cfg=LISTS[key],box=document.getElementById('list-'+key);
  const q=filter.trim().toLowerCase();
  let items=cfg.data.filter(it=>!q||it.name.toLowerCase().includes(q)||(it.desc||'').toLowerCase().includes(q));
  if(key==='files'&&sortMode==='name')items=[...items].sort((a,b)=>a.name.localeCompare(b.name));
  if(key==='files'&&sortMode==='size')items=[...items].sort((a,b)=>a.type==='dir'?-1:1);
  box.className=viewMode==='grid'&&key!=='deploy'?'card-grid':'card-list';
  box.innerHTML=items.length?items.map(cfg.render).join('')
    :`<div class="empty" style="grid-column:1/-1"><i class="fa-regular fa-folder-open"></i><p>没有匹配的结果</p></div>`;
  if(key==='files'){
    const d=items.filter(i=>i.type==='dir').length;
    document.getElementById('filesCount').textContent=`文件夹 ${d} · 文件 ${items.length-d}`;
  }
}
['repos','starred','files','deploy'].forEach(k=>paint(k));

/* ============ 标签栏 / 界面切换 ============ */
const SCREENS={repos:'scr-repos',starred:'scr-starred',deploy:'scr-deploy',me:'scr-me'};
const TITLES={repos:['我的仓库','mudanjun · 24 个仓库'],starred:['星标仓库','4 个已收藏'],
  deploy:['网站部署','3 个站点'] ,me:['我的','账户与偏好设置']};
let currentTab='repos';

function gotoTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('is-active',t.dataset.tab===tab));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('is-active'));
  document.getElementById(SCREENS[tab]).classList.add('is-active');
  document.getElementById('barTitle').textContent=TITLES[tab][0];
  document.getElementById('barSub').textContent=TITLES[tab][1];
  document.getElementById('ctxbar').classList.add('is-hidden');
  document.getElementById('backBtn').style.display='none';
  ctxStack=[]; updateFab();
  document.getElementById('content').scrollTop=0;
}
function syncHeader(){
  const repo=ctxStack[0].label, branch=ctxStack[1].label;
  const dirs=ctxStack.filter(c=>c.type==='dir');
  document.getElementById('barTitle').textContent=dirs.length?dirs[dirs.length-1].label:repo;
  document.getElementById('barSub').textContent=`${branch} · ${FILES.length} 项`;
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>gotoTab(t.dataset.tab));

/* 打开仓库 → 文件浏览（层级下钻，Tab 保持不变） */
function openRepo(name,from){
  originTab=from||currentTab;
  ctxStack=[{type:'repo',label:name},{type:'branch',label:'main'}];
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('is-active'));
  document.getElementById('scr-files').classList.add('is-active');
  document.getElementById('backBtn').style.display='';
  syncHeader(); renderCtx(); updateFab();
  document.getElementById('content').scrollTop=0;
}
function renderCtx(){
  const bar=document.getElementById('ctxbar');
  if(!ctxStack.length){bar.classList.add('is-hidden');return}
  bar.classList.remove('is-hidden');
  bar.innerHTML=ctxStack.map((c,i)=>
    `<button class="crumb ${c.type==='branch'?'is-branch':''} ${i===ctxStack.length-1?'is-current':''}"
       data-crumb="${i}" aria-label="${esc(c.label)}">
       <i class="${CRUMB_ICON[c.type]}"></i>${esc(c.label)}
       ${i<ctxStack.length-1?'<i class="fa-solid fa-chevron-right"></i>':''}
     </button>`).join('');
  bar.querySelectorAll('[data-crumb]').forEach(b=>b.onclick=()=>{
    ctxStack=ctxStack.slice(0,Math.max(2,+b.dataset.crumb+1));
    syncHeader(); renderCtx();
  });
  bar.scrollLeft=bar.scrollWidth;
}
document.getElementById('backBtn').onclick=()=>{
  if(ctxStack.length>2){ctxStack.pop();syncHeader();renderCtx();}
  else gotoTab(originTab);
};

/* ============ FAB ============ */
const FAB_ACTIONS={
  global:[['fa-solid fa-folder-plus','新建仓库','打开新建仓库'],
          ['fa-solid fa-file-import','导入仓库','打开导入仓库'],
          ['fa-brands fa-github','扫描二维码','打开扫码']],
  repo:[['fa-regular fa-file-lines','新建文件','打开编辑器'],
        ['fa-solid fa-folder-plus','新建文件夹','打开新建文件夹'],
        ['fa-solid fa-cloud-arrow-up','上传文件','打开文件选择器']],
  dir:[['fa-regular fa-file-lines','新建文件','在此目录新建文件'],
       ['fa-solid fa-folder-plus','新建子文件夹','在此目录新建文件夹'],
       ['fa-solid fa-cloud-arrow-up','上传到此处','选择文件上传到此目录']]
};
function updateFab(){
  const scope=currentTab==='repos'&&!ctxStack.length?'global':(currentTab==='deploy'||currentTab==='me'?'global':'dir');
  document.getElementById('fabMenu').innerHTML=FAB_ACTIONS[scope]
    .map(([i,label])=>`<button class="fab-item" data-toast="${label}"><i class="${i}"></i>${label}</button>`).join('');
}
document.getElementById('fab').onclick=e=>{
  e.stopPropagation();
  const f=document.getElementById('fab'),m=document.getElementById('fabMenu');
  const open=!m.classList.contains('is-open');
  m.classList.toggle('is-open',open); f.classList.toggle('is-open',open);
  document.getElementById('scrim').classList.toggle('is-open',open);
};
updateFab();

/* ============ 底部动作面板 ============ */
const SHEETS={
  more:{title:'更多操作',items:()=>[
      {icon:'fa-solid fa-arrow-down-wide-short',label:'排序',sub:'当前：'+SORT_LABEL[sortMode],sheet:'sortSheet'},
      {icon:'fa-solid fa-table-cells-large',label:'视图',sub:viewMode==='list'?'列表':'网格',sheet:'viewSheet'},
      {icon:'fa-regular fa-circle-check',label:'多选',sub:'批量移动 / 删除',act:'select'},
      {divider:1},
      {icon:'fa-solid fa-shield-halved',label:'代理加速',sub:'已开启 · 香港',sheet:'proxySheet'},
      {icon:'fa-solid fa-code-branch',label:'切换分支',sub:'main',toast:'打开分支选择'},
      {icon:'fa-solid fa-rotate',label:'刷新',act:'refresh'}]},
  sort:{title:'排序方式',pick:'sort',items:()=>[
      {val:'smart',icon:'fa-solid fa-wand-magic-sparkles',label:'智能排序',sub:'文件夹优先，同类按名称'},
      {val:'name',icon:'fa-solid fa-arrow-down-a-z',label:'名称',sub:'A → Z'},
      {val:'size',icon:'fa-solid fa-arrow-down-wide-short',label:'大小',sub:'大 → 小'},
      {val:'time',icon:'fa-regular fa-clock',label:'最近修改',sub:'新 → 旧'}]},
  view:{title:'视图',pick:'view',items:()=>[
      {val:'list',icon:'fa-solid fa-list',label:'列表',sub:'信息完整，适合浏览'},
      {val:'grid',icon:'fa-solid fa-table-cells-large',label:'网格',sub:'两列卡片，适合图片与仓库'}]},
  proxy:{title:'代理加速',items:()=>[
      {icon:'fa-solid fa-power-off',label:'总开关',sub:'已开启',act:'toggleProxy'},
      {divider:1},
      {val:'hk',icon:'fa-solid fa-server',label:'香港节点',sub:'延迟 32 ms',pick:'proxy'},
      {val:'sg',icon:'fa-solid fa-server',label:'新加坡节点',sub:'延迟 68 ms',pick:'proxy'},
      {val:'jp',icon:'fa-solid fa-server',label:'东京节点',sub:'延迟 91 ms',pick:'proxy'}]},
  menu:{title:'长按菜单项',items:()=>[
      {val:'open',icon:'fa-solid fa-folder-open',label:'打开',pick:'menu',on:true},
      {val:'rename',icon:'fa-solid fa-pen',label:'重命名',pick:'menu',on:true},
      {val:'download',icon:'fa-solid fa-download',label:'下载',pick:'menu',on:true},
      {val:'copy',icon:'fa-solid fa-link',label:'复制链接',pick:'menu',on:true},
      {val:'move',icon:'fa-solid fa-arrows-turn-to-dots',label:'移动',pick:'menu',on:true},
      {val:'release',icon:'fa-solid fa-tag',label:'发布版本',pick:'menu',on:true},
      {val:'star',icon:'fa-regular fa-star',label:'星标',pick:'menu',on:true},
      {val:'info',icon:'fa-solid fa-circle-info',label:'详情',pick:'menu'},
      {val:'delete',icon:'fa-solid fa-trash-can',label:'删除',pick:'menu',on:true,danger:1}]},
  repo:{title:'仓库操作',items:()=>[
      {icon:'fa-solid fa-folder-open',label:'打开',toast:'打开仓库'},
      {icon:'fa-solid fa-code-branch',label:'切换分支',toast:'打开分支选择'},
      {icon:'fa-solid fa-rocket',label:'发布为站点',toast:'打开部署配置'},
      {icon:'fa-solid fa-tag',label:'版本管理',toast:'打开 Releases'},
      {icon:'fa-solid fa-star',label:'加入星标',toast:'已加入星标'},
      {divider:1},
      {icon:'fa-solid fa-trash-can',label:'删除仓库',toast:'删除仓库',danger:1}]},
  file:{title:'文件操作',items:()=>[
      {icon:'fa-solid fa-folder-open',label:'打开',toast:'打开文件'},
      {icon:'fa-solid fa-download',label:'下载',toast:'开始下载'},
      {icon:'fa-solid fa-pen',label:'重命名',toast:'打开重命名'},
      {icon:'fa-solid fa-link',label:'复制路径',toast:'路径已复制'},
      {icon:'fa-solid fa-arrows-turn-to-dots',label:'移动到…',toast:'打开目录选择'},
      {divider:1},
      {icon:'fa-solid fa-trash-can',label:'删除',toast:'文件已删除',danger:1}]},
  deploy:{title:'站点操作',items:()=>[
      {icon:'fa-solid fa-arrow-up-right-from-square',label:'访问站点',toast:'打开站点'},
      {icon:'fa-solid fa-rotate',label:'重新部署',toast:'已触发重新部署'},
      {icon:'fa-solid fa-globe',label:'自定义域名',toast:'打开域名设置'},
      {divider:1},
      {icon:'fa-solid fa-power-off',label:'下线站点',toast:'站点已下线',danger:1}]}
};
const SORT_LABEL={smart:'智能排序',name:'名称',size:'大小',time:'最近修改'};
let proxyNode='hk';
const PICKS={sort:{get:()=>sortMode,set:v=>{sortMode=v;document.getElementById('sortHint').textContent=SORT_LABEL[v];
    document.getElementById('filesSortLabel').textContent=SORT_LABEL[v];paint('files')}},
  view:{get:()=>viewMode,set:v=>{viewMode=v;document.getElementById('viewHint').textContent=v==='list'?'列表':'网格';
    ['repos','starred','files'].forEach(paint)}},
  proxy:{get:()=>proxyNode,set:v=>{proxyNode=v;toast('已切换到 '+document.querySelector(`[data-val="${v}"] .flex-1`).textContent.trim())}},
  menu:{get:()=>null,set:()=>{}}};

function openSheet(key,dyn){
  const cfg=SHEETS[key]; if(!cfg)return;
  const items=cfg.items(dyn);
  document.getElementById('sheetTitle').innerHTML=esc(cfg.title)+(dyn&&dyn.name?` <small>${esc(dyn.name)}</small>`:'');
  document.getElementById('sheetBody').innerHTML=items.map(it=>{
    if(it.divider)return `<div class="sheet-divider"></div>`;
    const cur=cfg.pick?PICKS[cfg.pick].get():null;
    const on=cfg.pick==='menu'?it.on:cur===it.val;
    return `<button class="opt ${on?'is-selected':''} ${it.danger?'danger':''}" ${it.val?`data-val="${it.val}"`:''}
      ${it.sheet?`data-sheet="${it.sheet}"`:''} ${it.act?`data-act="${it.act}"`:''} ${it.toast?`data-toast="${it.toast}"`:''}>
      <i class="fa-solid ${it.icon} lead"></i>
      <span class="flex-1">${esc(it.label)}${it.sub?`<span class="sub">${esc(it.sub)}</span>`:''}</span>
      ${cfg.pick?`<span class="check"><i class="fa-solid fa-check"></i></span>`:''}
    </button>`;
  }).join('');
  openLayer('sheet');
}
document.getElementById('moreBtn').onclick=()=>openSheet('more');
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-sheet]'); if(!el)return;
  e.stopPropagation(); openSheet(el.dataset.sheet==='sortSheet'?'sort':el.dataset.sheet==='viewSheet'?'view':el.dataset.sheet==='proxySheet'?'proxy':el.dataset.sheet==='menuSheet'?'menu':el.dataset.sheet);
});

/* 层控制 */
function openLayer(which){
  document.getElementById('scrim').classList.add('is-open');
  if(which==='sheet')document.getElementById('sheet').classList.add('is-open');
  closeFab();
}
function closeLayers(){
  document.getElementById('scrim').classList.remove('is-open');
  document.getElementById('sheet').classList.remove('is-open');
  closeFab();
}
function closeFab(){
  document.getElementById('fabMenu').classList.remove('is-open');
  document.getElementById('fab').classList.remove('is-open');
  if(!document.getElementById('sheet').classList.contains('is-open'))
    document.getElementById('scrim').classList.remove('is-open');
}
document.getElementById('scrim').onclick=closeLayers;

/* 面板内动作 */
document.getElementById('sheetBody').addEventListener('click',e=>{
  const opt=e.target.closest('.opt'); if(!opt)return;
  const cfg=SHEETS[Object.keys(SHEETS).find(k=>document.getElementById('sheetTitle').textContent.startsWith(SHEETS[k].title))];
  if(cfg&&cfg.pick&&opt.dataset.val){
    PICKS[cfg.pick].set(opt.dataset.val);
    if(cfg.pick==='menu'){opt.classList.toggle('is-selected');opt.querySelector('.check').style.opacity=opt.classList.contains('is-selected')?1:0;return}
    openSheet(cfg.pick==='sort'?'sort':cfg.pick==='view'?'view':cfg.pick==='proxy'?'proxy':'menu');return;
  }
  if(opt.dataset.sheet){openSheet(opt.dataset.sheet);return}
  if(opt.dataset.act==='select'){enterSelect();closeLayers();return}
  if(opt.dataset.act==='refresh'){closeLayers();doRefresh();return}
  if(opt.dataset.act==='toggleProxy'){toast('代理已切换');return}
  if(opt.dataset.toast)toast(opt.dataset.toast);
  closeLayers();
});

/* ============ 多选 ============ */
function enterSelect(){
  selectMode=true;selected.clear();
  document.querySelectorAll('.card[data-name]').forEach(c=>c.onclick=e=>{
    const n=c.dataset.name;
    if(selected.has(n)){selected.delete(n);c.classList.remove('is-selected')}
    else{selected.add(n);c.classList.add('is-selected')}
    document.getElementById('selCount').textContent=`已选 ${selected.size} 项`;
  });
  document.getElementById('selectBar').classList.add('is-open');
  document.getElementById('selCount').textContent='已选 0 项';
  toast('已进入多选，点按卡片选择');
}
document.getElementById('exitSelect').onclick=()=>{
  selectMode=false;selected.clear();
  document.querySelectorAll('.card.is-selected').forEach(c=>c.classList.remove('is-selected'));
  document.querySelectorAll('.card[data-name]').forEach(c=>c.onclick=null);
  document.getElementById('selectBar').classList.remove('is-open');
};

/* ============ 卡片交互 ============ */
document.getElementById('content').addEventListener('click',e=>{
  const menu=e.target.closest('[data-menu]');
  if(menu){e.stopPropagation();
    const card=menu.closest('.card');
    openSheet(menu.dataset.menu,{name:card.dataset.name});return}
  const card=e.target.closest('.card[data-name]');
  if(!card||selectMode)return;
  const onRepos=document.getElementById('scr-repos').classList.contains('is-active');
  const onStarred=document.getElementById('scr-starred').classList.contains('is-active');
  const onFiles=document.getElementById('scr-files').classList.contains('is-active');
  if(onRepos||onStarred){openRepo(card.dataset.name,currentTab);return}
  if(onFiles&&card.dataset.type==='dir'){
    ctxStack.push({type:'dir',label:card.dataset.name});syncHeader();renderCtx();return}
  toast('打开 '+card.dataset.name);
});

/* ============ 搜索过滤 ============ */
document.querySelectorAll('.filter-input').forEach(inp=>{
  inp.addEventListener('input',()=>{
    paint(inp.dataset.target,inp.value);
    inp.parentElement.querySelector('.search-clear').classList.toggle('show',!!inp.value);
  });
});
document.querySelectorAll('.search-clear').forEach(b=>b.onclick=()=>{
  const inp=b.parentElement.querySelector('input');inp.value='';paint(inp.dataset.target,'');b.classList.remove('show');
});
document.getElementById('searchBtn').onclick=()=>{
  const box=document.querySelector('.screen.is-active .filter-input');
  if(box){box.focus();box.scrollIntoView({block:'center'})}
  else toast('全局搜索：仓库 / 用户 / 链接 / 文件');
};

/* ============ 下拉刷新 ============ */
const content=document.getElementById('content'),ptr=document.getElementById('ptr');
let startY=0;
content.addEventListener('touchstart',e=>{if(content.scrollTop<=0)startY=e.touches[0].clientY},{passive:true});
content.addEventListener('touchmove',e=>{
  if(content.scrollTop<=0&&e.touches[0].clientY-startY>70&&!ptr.classList.contains('is-loading'))doRefresh();
},{passive:true});
function doRefresh(){
  ptr.classList.add('is-loading');
  setTimeout(()=>{ptr.classList.remove('is-loading');toast('内容已更新')},1100);
}

/* ============ 主题 ============ */
document.getElementById('themeRow').onclick=()=>{
  const light=document.documentElement.dataset.theme==='light';
  document.documentElement.dataset.theme=light?'dark':'light';
  document.getElementById('themeSwitch').classList.toggle('on',light);
  document.querySelector('meta[name=theme-color]').content=light?'#0B0D12':'#F4F5F8';
  document.querySelector('#themeRow .row-icon i').className=light?'fa-solid fa-moon':'fa-solid fa-sun';
  document.querySelector('#themeRow .row-label').textContent=light?'深色主题':'浅色主题';
};

/* ============ Toast ============ */
let toastTimer;
function toast(msg){
  document.getElementById('toastMsg').textContent=msg;
  const t=document.getElementById('toast');
  t.classList.add('is-open');clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('is-open'),1900);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-toast]'); if(!el)return;
  toast(el.dataset.toast);
});

/* ============ 登录 / 登出 ============ */
document.getElementById('loginBtn').onclick=()=>{
  const v=document.getElementById('tokenInput').value.trim();
  if(!v){toast('请先粘贴 Access Token');return}
  document.getElementById('auth').classList.add('is-hidden');
  setTimeout(()=>{document.getElementById('auth').style.display='none';toast('登录成功')},380);
};
document.getElementById('logoutRow').onclick=()=>{
  document.getElementById('auth').style.display='';
  requestAnimationFrame(()=>document.getElementById('auth').classList.remove('is-hidden'));
  gotoTab('repos');
};
document.getElementById('accountsBtn').onclick=()=>toast('多账户管理：3 个已保存账户');
</script>
</body>
</html>
